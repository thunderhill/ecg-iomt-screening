[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-screening"
version = "0.1.0"
description = "Explainable edge AI for low-cost IoMT ECG screening (ESP32 + AD8232). Research prototype, not a medical device."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "wfdb>=4.1",
    "cryptography>=42",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
shap = ["shap>=0.45"]
cnn = ["torch>=2.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
